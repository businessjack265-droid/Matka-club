<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MATKA CLUB</title><style>
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}html,body{margin:0;background:#090909;color:#fff}button,input,select{font:inherit}.gold{color:#f2c653}.muted{color:#999}.app{max-width:560px;margin:auto;padding:0 15px 35px}.header{height:78px;display:flex;align-items:center;justify-content:space-between}.user-header{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:10px}.user-header .logo{text-align:center;font-size:21px}.user-coins{border:1px solid #80621e;background:#111;border-radius:12px;padding:9px 10px;color:#f2c653;font-size:11px;font-weight:800;white-space:nowrap}.user-coins span{display:block;font-size:14px;margin-top:2px;text-align:right}.logo{font-size:27px;font-weight:900}.menu{width:48px;height:48px;border:1px solid #80621e;border-radius:14px;background:#111;color:#f2c653;font-size:24px}.hero,.card,.market{background:#12110d;border:1px solid #3c3018;border-radius:18px}.hero{padding:22px;margin-bottom:18px}.hero-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.hero h1{margin:0;color:#f2c653;font-size:29px}.hero p{margin:7px 0 0;color:#999;font-size:13px}.live,.status{border:1px solid #357844;background:#102016;color:#62d77a;border-radius:20px;padding:7px 10px;font-size:10px;white-space:nowrap}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:18px}.tab{height:55px;background:#111;color:#999;border:1px solid #333;border-radius:13px;font-weight:800}.tab.active{background:linear-gradient(135deg,#f5d06a,#dcae3f);color:#111}.section{display:none}.section.active{display:block}.title{text-align:center;color:#f2c653;font-size:18px;margin:7px 0 13px}.market{overflow:hidden;margin-bottom:12px;background:#111}.mh{padding:14px 15px;display:flex;justify-content:space-between;gap:10px}.mn{font-size:16px;font-weight:800}.mt{font-size:10px;color:#777;margin-top:4px}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:12px;border-top:1px solid #292929}.result{text-align:center;background:#0b0b0b;border:1px solid #292929;border-radius:11px;padding:10px 3px}.label{color:#888;font-size:9px}.patti{font-size:16px;color:#ddd;min-height:18px;font-weight:800}.ank{font-size:29px;line-height:1;color:#f2c653;font-weight:900}.jodi .patti{font-size:27px;color:#f2c653}.footer{text-align:center;color:#555;font-size:10px;margin-top:24px}.drawer{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none}.drawer.open{display:block}.drawer-panel{position:absolute;right:0;top:0;width:min(350px,90%);height:100dvh;background:#111;border-left:1px solid #5c471a;padding:20px;overflow:auto}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.drawer-item{width:100%;padding:14px;margin:7px 0;background:#0b0b0b;border:1px solid #292929;border-radius:12px;color:#eee;text-align:left;font-weight:800}.drawer-item.logout-item{color:#ff6b6b;border-color:#6b2929}.panel{padding:8px 0}.backbtn{margin-bottom:12px}.card{padding:17px;margin-bottom:12px;background:#121212}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(430px,100%);padding:20px;background:#121212;border:1px solid #333;border-radius:18px}.field{margin:10px 0}.field label{display:block;margin-bottom:6px;font-size:12px;color:#aaa}input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #333;background:#0b0b0b;color:#fff}.btn{border:0;border-radius:10px;padding:11px 14px;background:#e4b94f;color:#111;font-weight:800;cursor:pointer}.btn.secondary{background:#292929;color:#eee}.btn.danger{background:#7d3030;color:#fff}.btn.small{padding:7px 9px;font-size:11px}.predict-box{margin-top:10px;padding:12px;border-top:1px solid #292929}.num-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}.num-btn{padding:11px 4px;border:1px solid #333;border-radius:10px;background:#0b0b0b;color:#ddd;font-weight:900}.num-btn.active{background:#f2c653;color:#111;border-color:#f2c653}.alloc-row{display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:center;margin:7px 0}.alloc-num{padding:10px;border:1px solid #80621e;border-radius:10px;background:#f2c653;color:#111;text-align:center;font-weight:900}.alloc-input{padding:10px}.total-box{margin:12px 0;padding:12px;border:1px solid #3c3018;border-radius:12px;background:#0b0b0b;display:flex;justify-content:space-between}.mini-note{font-size:11px;color:#888;line-height:1.4}.prediction-list{display:grid;gap:8px}.prediction-item{padding:11px;border:1px solid #292929;border-radius:11px;background:#0b0b0b}.prediction-item b{color:#f2c653}.admin{min-height:100vh;background:#090909}.top{max-width:1000px;margin:auto;padding:18px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292929}.brand{font-size:22px;font-weight:900;color:#f2c653}.wrap{max-width:1000px;margin:auto;padding:18px 16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{font-size:26px;font-weight:900;margin-top:7px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:11px 8px;border-bottom:1px solid #292929;text-align:left;font-size:12px}th{color:#999}.navtabs{display:flex;gap:8px;overflow:auto;margin-bottom:15px}.navtabs button{white-space:nowrap}.notice{padding:10px 12px;border-radius:10px;background:#102016;border:1px solid #357844;color:#62d77a;margin-bottom:12px;font-size:12px}.danger-text{color:#ff8a8a}.prediction-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.manual-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}.selected-list{display:grid;gap:7px;margin-top:10px}.selected-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px;border:1px solid #292929;border-radius:10px;background:#0b0b0b}.status-win{color:#62d77a;font-weight:900}.status-loss{color:#ff8a8a;font-weight:900}.status-pending{color:#f2c653;font-weight:900}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.summary-box{padding:10px;border:1px solid #292929;border-radius:10px;background:#0b0b0b;text-align:center}.summary-box strong{display:block;font-size:18px;margin-top:3px}.mini-bal{display:flex;gap:10px;justify-content:flex-end;align-items:center;font-size:10px;color:#888}.mini-bal b{font-size:11px;color:#f2c653}.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.dash-box{padding:10px;border:1px solid #292929;border-radius:10px;background:#0b0b0b}.dash-box span{display:block;font-size:10px;color:#888}.dash-box strong{font-size:18px;display:block;margin-top:4px}.filter-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}@media(max-width:700px){.dash-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.prediction-form-grid,.manual-row{grid-template-columns:1fr}.selected-row{grid-template-columns:1fr auto auto}.summary-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px}.wrap{padding:14px 10px}}
</style></head><body><div id="app"></div><script>
const KEY='matkaClubSessionV22';let session=null,state={results:[],users:[],transactions:[],requests:[],loginHistory:[],auditLog:[],resultHistory:[],settings:{},predictions:[],notifications:[]},currentView='login',drawerOpen=false,refreshBusy=false;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(session));document.cookie='matka_session='+encodeURIComponent(JSON.stringify(session))+';path=/;max-age=2592000;SameSite=Lax'}
function load(){try{session=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}if(!session){const m=document.cookie.match(/(?:^|; )matka_session=([^;]+)/);if(m)try{session=JSON.parse(decodeURIComponent(m[1]))}catch{}}}
function clear(){session=null;localStorage.removeItem(KEY);document.cookie='matka_session=;path=/;max-age=0'}
async function api(url,opt={}){const h=Object.assign({'Content-Type':'application/json'},opt.headers||{});if(session?.token)h.Authorization='Bearer '+session.token;const r=await fetch(url,Object.assign({},opt,{headers:h,cache:'no-store'}));let j={};try{j=await r.json()}catch{}if(!r.ok){const e=new Error(j.error||'Request failed');e.status=r.status;throw e}return j}
function toast(t){let n=$('toast');if(!n){n=document.createElement('div');n.id='toast';n.style='position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#f2c653;color:#111;padding:11px 15px;border-radius:10px;font-weight:800;z-index:9999';document.body.appendChild(n)}n.textContent=t;n.style.display='block';clearTimeout(n._t);n._t=setTimeout(()=>n.style.display='none',2200)}
let publicSettings={siteName:'MATKA CLUB',support:''};
function whatsappUrl(value){const v=String(value||'').trim();if(!v)return '';if(/^https?:\/\//i.test(v))return v;if(v.startsWith('wa.me/'))return 'https://'+v;const phone=v.replace(/[^0-9]/g,'');return phone?'https://wa.me/'+phone:''}
function loginPage(){currentView='login';$('app').innerHTML=`<div class="login"><div class="box"><h1 class="gold" style="margin-top:0">${esc(publicSettings.siteName||'MATKA CLUB')}</h1><p class="muted">Secure access</p><div class="field"><label>Username</label><input id="lu" autocomplete="username"></div><div class="field"><label>Password</label><input id="lp" type="password" autocomplete="current-password"></div><button class="btn" style="width:100%" onclick="login()">Login</button><button class="btn secondary" style="width:100%;margin-top:10px" onclick="newUser()">New User</button><p id="newUserMsg" class="muted" style="font-size:11px;margin:10px 0 0"></p><p id="le" class="danger-text"></p></div></div>`;const b=$('newUserMsg');if(!whatsappUrl(publicSettings.support)){b.textContent='New User contact is not configured.'}}
async function newUser(){const url=whatsappUrl(publicSettings.support);if(!url){const b=$('newUserMsg');if(b)b.textContent='WhatsApp contact is not configured by Superadmin.';return}window.location.href=url}
async function loadPublicSettings(){try{const j=await api('/api/public-settings');publicSettings=Object.assign(publicSettings,j.settings||{});if(currentView==='login')loginPage()}catch{}}

async function login(){try{const j=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('lu').value.trim(),password:$('lp').value})});session={token:j.token,user:j.user};save();await loadState();route()}catch(e){$('le').textContent=e.message}}
async function loadState(){const j=await api('/api/state');state=j;session.user=(await api('/api/me')).user;save()}
function route(){if(!session)return loginPage();if(session.user.role==='USER')renderUser();else if(session.user.role==='ADMIN')renderAdmin();else if(session.user.role==='SUPERADMIN')renderSuper();else{clear();loginPage()}}
function adminShell(active,body){$('app').innerHTML=`<div class="admin"><div class="top"><div class="brand">MATKA CLUB</div><div><span class="muted">${session.user.role}</span> <button class="btn secondary small" onclick="logout()">Logout</button></div></div><div class="wrap">${body}</div></div>`;}
function renderSuper(){currentView='super';adminShell('',`<div class="grid"><div class="card"><span class="muted">My Coin Balance</span><div id="saCoins" class="stat gold">0</div></div><div class="card"><span class="muted">Admins</span><div id="ac" class="stat">0</div></div><div class="card"><span class="muted">Published Results</span><div id="pc" class="stat">0</div></div></div><div id="superMini" class="card"><div class="mini-bal"><span>UP <b id="superUp">0</b></span><span>CB <b id="superCb">0</b></span></div></div><div class="navtabs"><button class="btn small" onclick="superSection('results')">Results</button><button class="btn secondary small" onclick="superSection('dashboard')">Dashboard</button><button class="btn secondary small" onclick="superSection('analytics')">Analytics</button><button class="btn secondary small" onclick="superSection('history')">Result History</button><button class="btn secondary small" onclick="superSection('audit')">Audit Log</button><button class="btn secondary small" onclick="superSection('admins')">Admin Management</button><button class="btn secondary small" onclick="superSection('statement')">Date Statement</button><button class="btn secondary small" onclick="superSection('transactions')">Transactions</button><button class="btn secondary small" onclick="superSection('settings')">Settings</button></div><div id="superArea"></div>`);superSection('results')}
function money(n){return Number(n||0).toLocaleString('en-IN')}
function dateKey(t){return new Date(Number(t||Date.now())).toISOString().slice(0,10)}
function superSection(s){const el=$('superArea');if(!el)return;if(s==='dashboard'){const users=state.users.filter(x=>x.role==='USER');const admins=state.users.filter(x=>x.role==='ADMIN');const cb=users.reduce((n,x)=>n+Number(x.coins||0),0),up=users.reduce((n,x)=>n+Number(x.up||0),0);el.innerHTML=`<div class="dash-grid"><div class="dash-box"><span>Total Users</span><strong>${users.length}</strong></div><div class="dash-box"><span>Total CB</span><strong>${money(cb)}</strong></div><div class="dash-box"><span>Total UP</span><strong>${money(up)}</strong></div><div class="dash-box"><span>Admins</span><strong>${admins.length}</strong></div></div><div class="card"><h2>Admin-wise Totals</h2><div class="table-wrap"><table><thead><tr><th>Admin</th><th>Users</th><th>CB</th><th>UP</th></tr></thead><tbody>${admins.map(a=>{const us=users.filter(u=>u.createdBy===a.username);return `<tr><td><b>${esc(a.name||a.username)}</b><div class="muted">${esc(a.username)}</div></td><td>${us.length}</td><td>${money(us.reduce((n,u)=>n+Number(u.coins||0),0))}</td><td>${money(us.reduce((n,u)=>n+Number(u.up||0),0))}</td></tr>`}).join('')||'<tr><td colspan="4">No admins/users.</td></tr>'}</tbody></table></div></div><div class="card"><h2>All Users — UP / CB</h2><div class="table-wrap"><table><thead><tr><th>User</th><th>Admin</th><th>UP</th><th>CB</th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.createdBy||'')}</td><td>${money(u.up)}</td><td>${money(u.coins)}</td></tr>`).join('')}</tbody></table></div></div>`;return}
if(s==='statement'){const tx=state.transactions;el.innerHTML=`<div class="card"><h2>Date-wise Statement</h2><div class="filter-row"><div class="field"><label>From</label><input id="sf" type="date" value="${dateKey(Date.now()-6*86400000)}"></div><div class="field"><label>To</label><input id="st" type="date" value="${dateKey(Date.now())}"></div><button class="btn" onclick="renderDateStatement('superArea',true)">Filter</button></div><div id="statementRows"></div></div>`;renderDateStatement('superArea',true);return}
if(s==='audit'){el.innerHTML=`<div class="card"><h2>Audit Log</h2><div class="field"><input id="auditSearch" oninput="filterAudit('super')" placeholder="Search actor, action, user..."></div><div id="auditRows"></div></div>`;filterAudit('super');return}
if(s==='analytics'){el.innerHTML=`<div class="card"><h2>Analytics</h2><div class="dash-grid"><div class="dash-box"><span>Users</span><strong>${state.users.filter(x=>x.role==='USER').length}</strong></div><div class="dash-box"><span>CB</span><strong>${money(state.users.filter(x=>x.role==='USER').reduce((n,x)=>n+Number(x.coins||0),0))}</strong></div><div class="dash-box"><span>UP</span><strong>${money(state.users.filter(x=>x.role==='USER').reduce((n,x)=>n+Number(x.up||0),0))}</strong></div><div class="dash-box"><span>Pending</span><strong>${state.requests.filter(r=>r.status==='pending').length}</strong></div></div></div>`;return}
if(s==='history')el.innerHTML=`<div class="card"><h2>Result History</h2>${state.resultHistory.map(x=>`<div style="padding:10px 0;border-bottom:1px solid #292929"><b>${esc(x.market)}</b> • ${esc(x.action)}<div class="muted">${esc(x.actor)} • ${new Date(x.time).toLocaleString()}</div></div>`).join('')||'<p class="muted">No result history.</p>'}</div>`;else if(s==='admins')el.innerHTML=`<div class="card"><h2>Create Admin</h2><div class="grid"><div class="field"><label>Name</label><input id="an"></div><div class="field"><label>Username</label><input id="au"></div><div class="field"><label>Password</label><input id="ap" type="password"></div></div><button class="btn" onclick="createAdmin()">Create Admin</button></div><div class="card"><h2>Admin Management</h2><div class="table-wrap"><table><thead><tr><th>Admin</th><th>Users</th><th>CB</th><th>UP</th><th>Status</th><th>Actions</th></tr></thead><tbody>${state.users.filter(x=>x.role==='ADMIN').map(a=>{const us=state.users.filter(u=>u.role==='USER'&&u.createdBy===a.username);return `<tr><td>${esc(a.name||a.username)}<div class="muted">${esc(a.username)}</div></td><td>${us.length}</td><td>${money(us.reduce((n,u)=>n+Number(u.coins||0),0))}</td><td>${money(us.reduce((n,u)=>n+Number(u.up||0),0))}</td><td>${a.blocked?'Blocked':'Active'}</td><td><button class="btn small" onclick="coin('${encodeURIComponent(a.username)}','deposit')">+Coins</button> <button class="btn secondary small" onclick="coin('${encodeURIComponent(a.username)}','withdraw')">-Coins</button> <button class="btn secondary small" onclick="toggleAdmin('${encodeURIComponent(a.username)}')">${a.blocked?'Unblock':'Block'}</button> <button class="btn secondary small" onclick="resetAdmin('${encodeURIComponent(a.username)}')">Password</button></td></tr>`}).join('')||'<tr><td colspan="6">No admins.</td></tr>'}</tbody></table></div></div>`;else if(s==='transactions')el.innerHTML=`<div class="card"><h2>Transactions</h2>${state.transactions.map(t=>`<div style="padding:10px 0;border-bottom:1px solid #292929"><b>${esc(t.type)}</b> • ${esc(t.target||t.actor||'')} • ${money(t.amount)}<div class="muted">${new Date(t.time).toLocaleString()}</div></div>`).join('')||'<p class="muted">No transactions.</p>'}</div>`;else if(s==='settings'){const sn=state.settings||{};el.innerHTML=`<div class="card"><h2>Settings</h2><div class="field"><label>Site Name</label><input id="sn" value="${esc(sn.siteName||'MATKA CLUB')}"></div><div class="field"><label>WhatsApp Number / Link</label><input id="support" value="${esc(sn.support||'')}"></div><button class="btn" onclick="saveSettings()">Save Settings</button></div>`}else el.innerHTML=`<div class="card"><h2>Results</h2><p class="muted">Result set/update sirf SUPERADMIN kar sakta hai.</p><div class="table-wrap"><table><thead><tr><th>Market</th><th>Open</th><th>Jodi</th><th>Close</th></tr></thead><tbody>${state.results.map(r=>`<tr><td>${esc(r.market)}</td><td>${r.openPatti} / ${r.openAnk}</td><td>${r.jodi}</td><td>${r.closePatti} / ${r.closeAnk}</td></tr>`).join('')}</tbody></table></div></div>`}
function renderAdmin(){currentView='admin';adminShell('',`<div class="grid"><div class="card"><span class="muted">My Coin Balance</span><div id="mycoins" class="stat gold">0</div></div><div class="card"><span class="muted">My Users</span><div id="uc" class="stat">0</div></div><div class="card"><span class="muted">Pending Requests</span><div id="rq" class="stat">0</div></div></div><div class="card"><div class="mini-bal"><span>UP <b id="adminUp">0</b></span><span>CB <b id="adminCb">0</b></span></div></div><div class="navtabs"><button class="btn small" onclick="adminSection('dashboard')">Dashboard</button><button class="btn secondary small" onclick="adminSection('users')">Users</button><button class="btn secondary small" onclick="adminSection('requests')">Requests</button><button class="btn secondary small" onclick="adminSection('results')">Results</button><button class="btn secondary small" onclick="adminSection('statement')">Date Statement</button><button class="btn secondary small" onclick="adminSection('activity')">Activity</button><button class="btn secondary small" onclick="adminSection('depositSettings')">Deposit Settings</button></div><div id="adminArea"></div>`);adminSection('dashboard')}
function adminSection(s){const el=$('adminArea');if(!el)return;const me=state.users.find(x=>x.username===session.user.username);const users=state.users.filter(x=>x.role==='USER'&&x.createdBy===session.user.username);if(s==='dashboard'){const cb=users.reduce((n,x)=>n+Number(x.coins||0),0),up=users.reduce((n,x)=>n+Number(x.up||0),0);el.innerHTML=`<div class="dash-grid"><div class="dash-box"><span>My Users</span><strong>${users.length}</strong></div><div class="dash-box"><span>Total CB</span><strong>${money(cb)}</strong></div><div class="dash-box"><span>Total UP</span><strong>${money(up)}</strong></div><div class="dash-box"><span>Pending</span><strong>${state.requests.filter(r=>r.status==='pending'&&r.admin===session.user.username).length}</strong></div></div><div class="card"><h2>User-wise UP / CB</h2><div class="table-wrap"><table><thead><tr><th>User</th><th>UP</th><th>CB</th><th>Status</th></tr></thead><tbody>${users.map(u=>`<tr><td><b>${esc(u.username)}</b></td><td>${money(u.up)}</td><td>${money(u.coins)}</td><td>${u.blocked?'Blocked':'Active'}</td></tr>`).join('')||'<tr><td colspan="4">No users.</td></tr>'}</tbody></table></div></div>`;return}
if(s==='statement'){el.innerHTML=`<div class="card"><h2>Date-wise Statement</h2><div class="filter-row"><div class="field"><label>From</label><input id="af" type="date" value="${dateKey(Date.now()-6*86400000)}"></div><div class="field"><label>To</label><input id="at" type="date" value="${dateKey(Date.now())}"></div><button class="btn" onclick="renderDateStatement('adminArea',false)">Filter</button></div><div id="statementRows"></div></div>`;renderDateStatement('adminArea',false);return}

function renderDateStatement(area,isSuper){const root=$(area),out=$('statementRows');if(!out)return;const from=$(isSuper?'sf':'af')?.value||'',to=$(isSuper?'st':'at')?.value||'';const visible=state.transactions.filter(t=>{const day=dateKey(t.time);if(isSuper)return (!from||day>=from)&&(!to||day<=to);return (t.admin===session.user.username||t.actor===session.user.username||dTargetOwner(t.target))&&(!from||day>=from)&&(!to||day<=to)});const by={};visible.forEach(t=>{const k=dateKey(t.time);(by[k]??=[]).push(t)});out.innerHTML=Object.keys(by).sort().reverse().map(k=>`<div class="card"><h3>${k}</h3>${by[k].map(t=>`<div style="padding:9px 0;border-bottom:1px solid #292929"><b>${esc(t.type)}</b> • ${esc(t.target||t.actor||'')} • ${money(t.amount)}<div class="muted">${new Date(t.time).toLocaleString()}</div></div>`).join('')}</div>`).join('')||'<p class="muted">No activity for selected dates.</p>'}
function dTargetOwner(target){const u=state.users.find(x=>x.username===target);return !!u&&u.createdBy===session.user.username}
function filterAudit(role){const q=String($('auditSearch')?.value||'').toLowerCase();const arr=state.auditLog.filter(x=>role==='super'||x.actor===session.user.username||x.admin===session.user.username||dTargetOwner(x.target));const rows=$('auditRows');if(!rows)return;rows.innerHTML=arr.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q)).slice(0,300).map(x=>`<div style="padding:10px 0;border-bottom:1px solid #292929"><b>${esc(x.type||'EVENT')}</b> • ${esc(x.target||x.username||'')}<div class="muted">${esc(x.actor||'')} • ${new Date(x.time).toLocaleString()}</div></div>`).join('')||'<p class="muted">No matching audit events.</p>'}
async function saveOpen(){const p=$('op').value.trim();if(!validPatti(p))return alert('Patti 3 digits aur ascending/non-decreasing honi chahiye, jaise 111, 112, 122, 149, 479.');try{await api('/api/result/open',{method:'POST',body:JSON.stringify({market:$('market').value,patti:p})});await loadState();superSection('results');toast('Open published')}catch(e){alert(e.message)}}async function saveClose(){const p=$('cp').value.trim();if(!validPatti(p))return alert('Patti 3 digits aur ascending/non-decreasing honi chahiye, jaise 111, 112, 122, 149, 479.');try{await api('/api/result/close',{method:'POST',body:JSON.stringify({market:$('market').value,patti:p})});await loadState();superSection('results');toast('Close updated')}catch(e){alert(e.message)}}

function marketTiming(name){const t={'Kalyan Morning':'11:00 AM – 12:00 PM','Kalyan':'03:45 PM – 05:45 PM','Kalyan Night':'09:20 PM – 11:20 PM','Milan Morning':'10:15 AM – 11:15 AM','Milan Day':'03:00 PM – 05:00 PM','Milan Night':'09:00 PM – 11:00 PM','Bombay Day':'03:45 PM – 05:45 PM','Bombay Night':'09:05 PM – 11:05 PM'};return t[name]||''}function resultCard(r){const tm=marketTiming(r.market);return `<div class="market"><div class="mh"><div><div class="mn">${esc(r.market)}</div><div class="mt">${tm?`Timing: ${tm}`:'Open first • Close later'}</div></div><span class="status">${r.published?'UPDATED':'WAITING'}</span></div><div class="results"><div class="result"><div class="label">OPEN</div><div class="patti">${esc(r.openPatti)}</div><div class="ank">${esc(r.openAnk)}</div></div><div class="result jodi"><div class="label">JODI</div><div class="patti">${esc(r.jodi)}</div></div><div class="result"><div class="label">CLOSE</div><div class="patti">${esc(r.closePatti)}</div><div class="ank">${esc(r.closeAnk)}</div></div></div><div class="predict-box"><button class="btn small" style="width:100%" onclick="openPrediction('${encodeURIComponent(r.market)}')">Make Prediction</button></div></div>`}
function renderUser(){currentView='user';document.body.style.overflow='';$('app').innerHTML=`<div class="app"><div class="header user-header"><button class="menu" onclick="openMenu()">☰</button><div class="logo gold">MATKA CLUB</div><div class="user-coins">COINS<span id="userCoins">0</span></div></div><div class="hero"><div class="hero-top"><div><h1>Matka Results</h1><p>Live result dashboard</p></div><span class="live">● LIVE</span></div></div><div class="card" style="margin-bottom:14px"><div class="mini-note"><b class="gold">Market Timings (IST)</b><br>Kalyan Morning: 11:00 AM – 12:00 PM • Kalyan: 03:45 PM – 05:45 PM • Kalyan Night: 09:20 PM – 11:20 PM • Milan Morning: 10:15 AM – 11:15 AM • Milan Day: 03:00 PM – 05:00 PM • Milan Night: 09:00 PM – 11:00 PM • Bombay Day: 03:45 PM – 05:45 PM • Bombay Night: 09:05 PM – 11:05 PM</div></div><div class="tabs"><button class="tab active" data-tab="kalyan" onclick="tab('kalyan')">KALYAN</button><button class="tab" data-tab="milan" onclick="tab('milan')">MILAN</button><button class="tab" data-tab="bombay" onclick="tab('bombay')">BOMBAY</button></div><div id="kalyan" class="section active"><div class="title">KALYAN</div><div id="kalyanList"></div></div><div id="milan" class="section"><div class="title">MILAN</div><div id="milanList"></div></div><div id="bombay" class="section"><div class="title">BOMBAY</div><div id="bombayList"></div></div><div class="footer">MATKA CLUB • Results information only • Coins are non-redeemable and have no cash value.</div></div><div id="drawer" class="drawer" onclick="if(event.target.id==='drawer')closeMenu()"><div class="drawer-panel"><div class="drawer-head"><b class="gold">MENU</b><button class="btn secondary small" onclick="closeMenu()">Close</button></div><button class="drawer-item" onclick="showPanel('home')">Home</button><button class="drawer-item" onclick="showPanel('deposit')">Deposit</button><button class="drawer-item" onclick="showPanel('withdraw')">Withdrawal</button><button class="drawer-item" onclick="showPanel('history')">History</button><button class="drawer-item" onclick="showPanel('resultHistory')">Result History</button><button class="drawer-item" onclick="showPanel('prediction')">Your Predictions <span id="drawerPredBadge" class="muted" style="float:right;font-size:11px">0</span></button><button class="drawer-item" onclick="showPanel('chart')">Chart</button><button class="drawer-item" onclick="showPanel('notifications')">Notifications <span id="drawerNotifBadge" class="muted" style="float:right;font-size:11px">0</span></button><button class="drawer-item" onclick="showPanel('profile')">Profile & Password</button><button class="drawer-item" onclick="showPanel('statement')">Statement</button><button class="drawer-item logout-item" onclick="logout()">Logout</button><p class="drawer-note">Coins are non-redeemable and have no cash value.</p></div></div>`;updateUser()}
function updateUser(){const groups={kalyan:['Kalyan Morning','Kalyan','Kalyan Night'],milan:['Milan Morning','Milan Day','Milan Night'],bombay:['Bombay Day','Bombay Night']};for(const g in groups){const el=$(g+'List');if(el)el.innerHTML=groups[g].map(n=>{const r=state.results.find(x=>x.market===n);return r?resultCard(r):''}).join('')}const me=state.users.find(x=>x.username===session?.user?.username)||session?.user;if($('userCoins'))$('userCoins').textContent=Number(me?.coins||0).toLocaleString('en-IN');const pb=$('drawerPredBadge');if(pb)pb.textContent=String((state.predictions||[]).length);const nb=$('drawerNotifBadge');if(nb)nb.textContent=String((state.notifications||[]).filter(n=>!n.read).length)}
function tab(t){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===t));session.tab=t;save()}
function openMenu(){drawerOpen=true;$('drawer')?.classList.add('open')}function closeMenu(){drawerOpen=false;$('drawer')?.classList.remove('open')}
function predictionKey(){return 'matkaClubPredictionsV2:'+session.user.username}
function predictionDraft(){return window.__predictionDraft||[]}
function setPredictionDraft(a){window.__predictionDraft=a}
function openPrediction(market){showPanel('prediction');setTimeout(()=>{const el=$('predictionMarket');if(el)el.value=decodeURIComponent(market);renderPredictionForm()},0)}
function renderPredictionForm(){
 const type=$('predictionType')?.value||'OPEN_CLOSE';
 const side=$('predictionSide'); if(side) side.style.display=type==='JODI'?'none':'block';
 const sideLabel=$('sideField'); if(sideLabel) sideLabel.style.display=type==='JODI'?'none':'block';
 const input=$('predictionNumber'); if(!input)return;
 input.value=''; input.maxLength=type==='OPEN_CLOSE'?1:type==='PATTI'?3:2;
 input.placeholder=type==='OPEN_CLOSE'?'0-9':type==='PATTI'?'123 (ascending)':'00-99';
 const hint=$('predictionHint');if(hint)hint.textContent=type==='OPEN_CLOSE'?'Enter one digit (0-9).':type==='PATTI'?'Enter exactly 3 digits in ascending/non-decreasing order, e.g. 112 or 149.':'Enter exactly 2 digits, including 00-99.';
 renderDraft();
}
function validManualPrediction(type,n){if(type==='OPEN_CLOSE')return /^\d$/.test(n);if(type==='JODI')return /^\d{2}$/.test(n);return validPatti(n)}
function addPredictionDraft(){
 const type=$('predictionType').value,market=$('predictionMarket').value,side=type==='JODI'?'':$('predictionSide').value,number=$('predictionNumber').value.trim(),coins=Number($('predictionCoins').value);
 if(!market||!validManualPrediction(type,number)){toast(type==='PATTI'?'Patti must be 3 digits in ascending order':type==='JODI'?'Jodi must be exactly 2 digits':'Open/Close must be exactly 1 digit');return}
 if(!Number.isInteger(coins)||coins<10){toast('Enter at least 10 prediction points');return}
 const a=predictionDraft();a.push({market,type,side,number,coins});setPredictionDraft(a);$('predictionNumber').value='';$('predictionCoins').value='';renderDraft();
}
function removeDraft(i){const a=predictionDraft();a.splice(i,1);setPredictionDraft(a);renderDraft()}
function renderDraft(){const el=$('selectedPredictionList'),totalEl=$('draftTotal');if(!el)return;const a=predictionDraft();el.innerHTML=a.length?a.map((p,i)=>`<div class="selected-row"><div><b>${esc(p.number)}</b><div class="muted">${esc(p.market)} • ${esc(p.type.replace('_',' / '))}${p.side?' • '+esc(p.side):''}</div></div><strong>${Number(p.coins).toLocaleString('en-IN')} points</strong><button class="btn secondary small" onclick="removeDraft(${i})">✕</button></div>`).join(''):'<p class="muted">No predictions added yet.</p>';if(totalEl)totalEl.textContent=a.reduce((n,p)=>n+p.coins,0).toLocaleString('en-IN')+' points'}
async function submitPrediction(){
 const a=predictionDraft();if(!a.length){toast('Add at least one prediction');return}
 try{const j=await api('/api/predictions',{method:'POST',body:JSON.stringify({items:a.map(p=>({...p,points:p.coins}))})});setPredictionDraft([]);await loadState();toast('Predictions saved');renderPredictionPanel()}catch(e){toast(e.message)}
}
function renderPredictionPanel(){
 const list=(state.predictions||[]),me=state.users.find(x=>x.username===session.user.username)||session.user;
 const wins=list.filter(x=>x.status==='CORRECT').length,losses=list.filter(x=>x.status==='INCORRECT').length,pending=list.filter(x=>x.status==='PENDING').length;
 const rows=list.length?list.map(x=>{const cls=x.status==='CORRECT'?'status-win':x.status==='INCORRECT'?'status-loss':'status-pending';const side=x.side?` • ${esc(x.side)}`:'';return `<div class="prediction-item"><b>${esc(x.market)} • ${esc(x.type.replace('_',' / '))}${side}</b><div style="margin-top:5px">Number: <strong>${esc(x.number)}</strong> • Points: <strong>${Number(x.predictionPoints??x.coins).toLocaleString('en-IN')}</strong></div><div style="margin-top:5px" class="${cls}">${esc(x.status==='CORRECT'?'CORRECT':x.status==='INCORRECT'?'INCORRECT':'PENDING')}${''}</div><div class="muted" style="margin-top:4px">${new Date(x.time).toLocaleString()}</div></div>`}).join(''):'<p class="muted">No predictions yet.</p>';
 const el=$('predictionList');if(el)el.innerHTML=rows;
 const w=$('predWins'),l=$('predLosses'),p=$('predPending');if(w)w.textContent=wins;if(l)l.textContent=losses;if(p)p.textContent=pending;
}

uperadmin ne configure nahi kiya.</p>'}</div><div class="card"><h3>Deposit Request</h3><p class="mini-note">Payment karne ke baad UTR aur payment screenshot/proof submit karein. Admin verification ke baad request approve/reject karega.</p><div class="field"><label>Coins</label><input id="reqAmount" type="number" min="1" step="1" placeholder="Enter coins"></div><div class="field"><label>UTR / Transaction ID</label><input id="reqUtr" maxlength="80" placeholder="Enter UTR / Transaction ID"></div><div class="field"><label>Payment Screenshot / Proof</label><input id="reqProof" type="file" accept="image/png,image/jpeg,image/webp" onchange="previewProof(this)"><div id="proofPreview" class="mini-note"></div></div><button class="btn" onclick="userRequest('add')">Submit Deposit Request</button><div id="reqMsg" class="muted" style="margin-top:10px"></div></div><div class="card"><h3>My Deposit Requests</h3>${(state.requests||[]).filter(r=>r.user===me.username&&r.type==='add').map(r=>`<div style="padding:11px 0;border-bottom:1px solid #292929"><b>${money(r.amount)} coins</b> • <span class="status-${esc(r.status)}">${esc(r.status.toUpperCase())}</span><div class="muted" style="margin-top:4px">UTR: ${esc(r.utr||'—')} • ${new Date(r.time).toLocaleString()}</div>${r.proof?`<img src="${esc(r.proof)}" alt="Payment proof" style="max-width:150px;width:100%;max-height:150px;object-fit:contain;border-radius:8px;background:#fff;padding:3px;margin-top:7px">`:''}${r.reviewedAt?`<div class="muted" style="margin-top:4px">Reviewed: ${new Date(r.reviewedAt).toLocaleString()}</div>`:''}</div>`).join('')||'<p class="muted">No deposit requests yet.</p>'}</div></div>`;}
 if(type==='withdraw') html=`<div class="card"><h2>Withdrawal</h2><p class="muted">Request a coin deduction from your balance for Admin review. No cash withdrawal is processed.</p><div class="field"><label>Coins</label><input id="reqAmount" type="number" min="1" step="1" placeholder="Enter coins"></div><button class="btn" onclick="userRequest('subtract')">Send Withdrawal Request</button><div id="reqMsg" class="muted" style="margin-top:10px"></div></div><div class="card"><h3>Available Coins</h3><div class="stat gold">${Number(me.coins||0).toLocaleString('en-IN')}</div></div>`;
 if(type==='resultHistory') html=`<div class="card"><h2>Result History</h2><p class="muted">Published result updates by market.</p>${(state.resultHistory||[]).length?(state.resultHistory.slice(0,200).map(x=>`<div style="padding:11px 0;border-bottom:1px solid #292929"><b class="gold">${esc(x.market)}</b> • ${esc(x.action)}<div class="muted" style="margin-top:4px">Open ${esc(x.openPatti)} / ${esc(x.openAnk)} • Jodi ${esc(x.jodi)} • Close ${esc(x.closePatti)} / ${esc(x.closeAnk)}</div><div class="muted" style="margin-top:4px">${new Date(x.time).toLocaleString()}</div></div>`).join('')):'<p class="muted">No result history yet.</p>'}</div>`;
 if(type==='history') html=`<div class="card"><h2>History</h2>${txRows}</div><div class="card"><h3>Latest Results</h3>${state.results.map(r=>`<div style="padding:11px 0;border-bottom:1px solid #292929"><b>${esc(r.market)}</b><div class="muted" style="margin-top:4px">Open ${esc(r.openPatti)} / ${esc(r.openAnk)} • Jodi ${esc(r.jodi)} • Close ${esc(r.closePatti)} / ${esc(r.closeAnk)}</div></div>`).join('')}</div>`;
 if(type==='prediction') html=`<div class="card"><h2>Your Predictions</h2><p class="muted">Choose a prediction type, manually enter the number, set prediction points, then add multiple predictions.</p><div class="field"><label>Market</label><select id="predictionMarket">${state.results.map(r=>`<option>${esc(r.market)}</option>`).join('')}</select></div><div class="field"><label>Prediction Type</label><select id="predictionType" onchange="renderPredictionForm()"><option value="OPEN_CLOSE">Open / Close</option><option value="PATTI">Patti</option><option value="JODI">Jodi</option></select></div><div id="sideField" class="field"><label>Side</label><select id="predictionSide"><option>OPEN</option><option>CLOSE</option></select></div><div class="manual-row"><div class="field"><label>Number</label><input id="predictionNumber" inputmode="numeric" autocomplete="off" placeholder="0-9"></div><div class="field"><label>Prediction Points</label><input id="predictionCoins" type="number" min="10" step="1" inputmode="numeric" placeholder="Coins"></div><button class="btn" onclick="addPredictionDraft()">Add</button></div><div id="predictionHint" class="mini-note"></div><div id="selectedPredictionList" class="selected-list"></div><div class="total-box"><span>Total prediction points</span><strong id="draftTotal">0 coins</strong></div><button class="btn" style="width:100%" onclick="submitPrediction()">Submit Predictions</button></div><div class="card"><h3>Win / Loss Summary</h3><div class="summary-grid"><div class="summary-box"><span class="muted">Wins</span><strong id="predWins" class="status-win">0</strong></div><div class="summary-box"><span class="muted">Losses</span><strong id="predLosses" class="status-loss">0</strong></div><div class="summary-box"><span class="muted">Pending</span><strong id="predPending" class="status-pending">0</strong></div></div></div><div class="card"><h3>Prediction History</h3><div id="predictionList" class="prediction-list"></div></div>`;
 if(type==='notifications') html=`<div class="card"><h2>Notifications</h2><div style="display:flex;gap:8px;margin-bottom:10px"><button class="btn small" onclick="markNotificationsRead()">Mark all read</button></div>${(state.notifications||[]).length?(state.notifications.map(n=>`<div style="padding:11px 0;border-bottom:1px solid #292929;opacity:${n.read?0.65:1}"><b>${esc(n.type)}</b><div style="margin-top:4px">${esc(n.message)}</div><div class="muted" style="margin-top:4px">${new Date(n.time).toLocaleString()}</div></div>`).join('')):'<p class="muted">No notifications.</p>'}</div>`;
 if(type==='profile') html=`<div class="card"><h2>Profile</h2><p><b>${esc(me.username)}</b> • ${esc(me.role)}</p><p class="muted">Account status: ${me.blocked?'Blocked':'Active'}</p></div><div class="card"><h2>Change Password</h2><div class="field"><label>Current Password</label><input id="oldpw" type="password"></div><div class="field"><label>New Password</label><input id="newpw" type="password"></div><button class="btn" onclick="changePassword()">Update Password</button><p id="pwmsg" class="muted"></p></div>`;
 if(type==='statement') html=`<div class="card"><h2>Statement</h2><p class="muted">Your complete coin activity ledger.</p>${txRows}</div><div class="card"><h3>Current Balance</h3><div class="stat gold">${Number(me.coins||0).toLocaleString('en-IN')}</div></div>`;
 if(type==='chart'){const vals=myTx.filter(t=>Number(t.amount)>0).slice(0,8).reverse();const max=Math.max(1,...vals.map(t=>Number(t.amount||0)));html=`<div class="card"><h2>Chart</h2><div style="height:220px;display:flex;align-items:end;gap:8px;border-bottom:1px solid #333;padding:10px 5px">${vals.length?vals.map(t=>`<div title="${esc(t.type)}: ${Number(t.amount||0)}" style="flex:1;height:${Math.max(8,Number(t.amount||0)/max*100)}%;background:#d8ad4b;border-radius:5px 5px 0 0"></div>`).join(''):'<span class="muted">No coin activity to chart.</span>'}</div><p class="muted">Your recent coin activity.</p></div>`;}
 $('app').innerHTML=`<div class="app panel"><button class="btn secondary backbtn" onclick="renderUser()">← Home</button>${html}</div>`;if(type==='prediction'){renderPredictionForm();renderPredictionPanel()}
}
let depositProofData='';function previewProof(input){const f=input?.files?.[0],msg=$('reqMsg');if(!f){depositProofData='';return}if(!/^image\/(png|jpe?g|webp)$/i.test(f.type)){input.value='';depositProofData='';if(msg)msg.textContent='Only PNG, JPG or WEBP image allowed.';return}if(f.size>1100000){input.value='';depositProofData='';if(msg)msg.textContent='Screenshot too large. Please select an image under 1.1 MB.';return}const r=new FileReader();r.onload=()=>{depositProofData=String(r.result||'');if($('proofPreview'))$('proofPreview').innerHTML='<img src="'+esc(depositProofData)+'" alt="Proof preview" style="max-width:220px;width:100%;border-radius:10px;margin-top:8px">'};r.readAsDataURL(f)}
async function userRequest(type){const input=$('reqAmount'),msg=$('reqMsg');const n=Number(input?.value);if(!Number.isInteger(n)||n<1){if(msg)msg.textContent='Enter a valid whole number.';return}const utr=type==='add'?String($('reqUtr')?.value||'').trim():'';if(type==='add'&&!utr){if(msg)msg.textContent='UTR / Transaction ID is required.';return}if(type==='add'&&!depositProofData){if(msg)msg.textContent='Payment screenshot/proof is required.';return}try{await api('/api/user/request',{method:'POST',body:JSON.stringify({type,amount:n,utr,proof:type==='add'?depositProofData:''})});depositProofData='';await loadState();toast(type==='add'?'Deposit request sent':'Withdrawal request sent');showPanel(type==='add'?'deposit':'withdraw')}catch(e){if(msg)msg.textContent=e.message}}
async function saveOpen(){const p=$('op').value.trim();if(!validPatti(p))return alert('Patti 3 digits aur ascending/non-decreasing honi chahiye, jaise 111, 112, 122, 149, 479.');try{await api('/api/result/open',{method:'POST',body:JSON.stringify({market:$('market').value,patti:p})});await loadState();superSection('results');toast('Open published')}catch(e){alert(e.message)}}async function saveClose(){const p=$('cp').value.trim();if(!validPatti(p))return alert('Patti 3 digits aur ascending/non-decreasing honi chahiye, jaise 111, 112, 122, 149, 479.');try{await api('/api/result/close',{method:'POST',body:JSON.stringify({market:$('market').value,patti:p})});await loadState();superSection('results');toast('Close updated')}catch(e){alert(e.message)}}
async function markNotificationsRead(){try{await api('/api/notifications/read',{method:'POST',body:'{}'});await loadState();showPanel('notifications')}catch(e){toast(e.message)}}
async function changePassword(){const old=$('oldpw')?.value||'',nw=$('newpw')?.value||'';if(nw.length<4){$('pwmsg').textContent='New password must be at least 4 characters.';return}try{await api('/api/password',{method:'POST',body:JSON.stringify({currentPassword:old,newPassword:nw})});$('pwmsg').textContent='Password updated successfully.';toast('Password updated')}catch(e){$('pwmsg').textContent=e.message}}
function validPatti(p){p=String(p||'').trim();return /^\d{3}$/.test(p)&&Number(p[0])<=Number(p[1])&&Number(p[1])<=Number(p[2])}
function filterUsers(){const q=String($('userSearch')?.value||'').toLowerCase();const rows=state.users.filter(u=>u.role==='USER'&&u.createdBy===session.user.username&&(!q||u.username.toLowerCase().includes(q)||(u.blocked?'blocked':'active').includes(q)));const el=$('userTable');if(!el)return;el.innerHTML=`<table><thead><tr><th>User</th><th>CB</th><th>UP</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(u=>`<tr><td><b>${esc(u.username)}</b></td><td>${money(u.coins)}</td><td>${money(u.up)}</td><td>${u.blocked?'Blocked':'Active'}</td><td><button class="btn small" onclick="userCoin('${encodeURIComponent(u.username)}','add')">+CB</button> <button class="btn secondary small" onclick="userCoin('${encodeURIComponent(u.username)}','subtract')">-CB</button> <button class="btn secondary small" onclick="toggleUser('${encodeURIComponent(u.username)}')">${u.blocked?'Unblock':'Block'}</button> <button class="btn secondary small" onclick="resetUser('${encodeURIComponent(u.username)}')">Password</button></td></tr>`).join('')||'<tr><td colspan="5">No users found.</td></tr>'}</tbody></table>`}
async function createAdmin(){try{await api('/api/admin/create',{method:'POST',body:JSON.stringify({name:$('an').value.trim(),username:$('au').value.trim(),password:$('ap').value})});await loadState();superSection('admins');toast('Admin created')}catch(e){alert(e.message)}}
async function coin(admin,action){const n=prompt((action==='deposit'?'Deposit':'Withdraw')+' coins');if(n===null)return;try{await api('/api/coins',{method:'POST',body:JSON.stringify({admin:decodeURIComponent(admin),action,amount:Number(n)})});await loadState();superSection('admins');toast('Coins updated')}catch(e){alert(e.message)}}
async function toggleAdmin(u){try{await api('/api/admin/toggle',{method:'POST',body:JSON.stringify({username:decodeURIComponent(u)})});await loadState();superSection('admins')}catch(e){alert(e.message)}}async function resetAdmin(u){const p=prompt('New password');if(p===null)return;try{await api('/api/admin/reset-password',{method:'POST',body:JSON.stringify({username:decodeURIComponent(u),password:p})});toast('Password reset')}catch(e){alert(e.message)}}
async function createUser(){try{await api('/api/user/create',{method:'POST',body:JSON.stringify({username:$('uu').value.trim(),password:$('up').value})});await loadState();adminSection('users');toast('User created')}catch(e){alert(e.message)}}async function userCoin(u,action){const n=prompt((action==='add'?'Add':'Subtract')+' coins');if(n===null)return;try{await api('/api/user/coins',{method:'POST',body:JSON.stringify({username:decodeURIComponent(u),action,amount:Number(n)})});await loadState();adminSection('users');toast('User balance updated')}catch(e){alert(e.message)}}async function toggleUser(u){try{await api('/api/user/toggle',{method:'POST',body:JSON.stringify({username:decodeURIComponent(u)})});await loadState();adminSection('users')}catch(e){alert(e.message)}}async function resetUser(u){const p=prompt('New password');if(p===null)return;try{await api('/api/user/reset-password',{method:'POST',body:JSON.stringify({username:decodeURIComponent(u),password:p})});toast('Password reset')}catch(e){alert(e.message)}}async function review(id,action){try{await api('/api/request/review',{method:'POST',body:JSON.stringify({id,action})});await loadState();adminSection('requests');toast('Request updated')}catch(e){alert(e.message)}}async function saveGameSettings(){const vals={openClose:Number($('rxOpenClose').value),jodi:Number($('rxJodi').value),patti:Number($('rxPatti').value)};try{const j=await api('/api/game-settings',{method:'POST',body:JSON.stringify(vals)});state.settings=Object.assign(state.settings,j.settings);if($('gameSettingMsg'))$('gameSettingMsg').textContent='Saved successfully.';toast('Game settings saved')}catch(e){if($('gameSettingMsg'))$('gameSettingMsg').textContent=e.message;else toast(e.message)}}
async function previewDepositQr(input,previewId,targetId){const f=input?.files?.[0];if(!f)return;if(!/^image\/(png|jpe?g|webp)$/i.test(f.type)){input.value='';alert('Only PNG, JPG or WEBP image allowed.');return}if(f.size>900000){input.value='';alert('QR image must be under 900 KB.');return}const r=new FileReader();r.onload=()=>{const data=String(r.result||'');$(targetId).value=data;$(previewId).innerHTML='<img src="'+esc(data)+'" alt="QR preview" style="max-width:180px;width:100%;border-radius:10px;background:#fff;padding:5px;margin-top:6px">'};r.readAsDataURL(f)}
async function saveDepositSettings(){const deposit={upiId:$('dupiId')?.value||'',upiHolder:$('dupiHolder')?.value||'',upiQr:$('dupiQr')?.value||'',bankHolder:$('dbankHolder')?.value||'',accountNumber:$('daccount')?.value||'',ifsc:$('difsc')?.value||'',cryptoAddress:$('dcryptoAddress')?.value||'',cryptoNetwork:$('dcryptoNetwork')?.value||'',cryptoQr:$('dcryptoQr')?.value||''};try{await api('/api/settings',{method:'POST',body:JSON.stringify({deposit})});await loadState();if($('depositSaveMsg'))$('depositSaveMsg').textContent='Saved successfully.';toast('Deposit settings saved')}catch(e){if($('depositSaveMsg'))$('depositSaveMsg').textContent=e.message;else toast(e.message)}}
async function saveSettings(){try{await api('/api/settings',{method:'POST',body:JSON.stringify({siteName:$('sn').value,support:$('support').value})});await loadState();await loadPublicSettings();toast('Settings saved')}catch(e){alert(e.message)}}
async function logout(){try{await api('/api/logout',{method:'POST'})}catch{}clear();loginPage()}
function updateVisible(){if(currentView==='user')updateUser();else if(currentView==='admin'){const me=state.users.find(x=>x.username===session.user.username);if($('mycoins'))$('mycoins').textContent=Number(me?.coins||0).toLocaleString('en-IN');if($('mycoins2'))$('mycoins2').textContent=Number(me?.coins||0).toLocaleString('en-IN');if($('uc'))$('uc').textContent=state.users.filter(x=>x.role==='USER'&&x.createdBy===session.user.username).length;if($('rq'))$('rq').textContent=state.requests.filter(r=>r.status==='pending').length;if($('adminUp'))$('adminUp').textContent=state.users.filter(x=>x.role==='USER'&&x.createdBy===session.user.username).reduce((n,x)=>n+Number(x.up||0),0).toLocaleString('en-IN');if($('adminCb'))$('adminCb').textContent=state.users.filter(x=>x.role==='USER'&&x.createdBy===session.user.username).reduce((n,x)=>n+Number(x.coins||0),0).toLocaleString('en-IN');if($('coinActivity'))$('coinActivity').textContent='UP/CB dashboard active'}else if(currentView==='super'){const me=state.users.find(x=>x.username===session.user.username);if($('saCoins'))$('saCoins').textContent=Number(me?.coins||0).toLocaleString('en-IN');if($('ac'))$('ac').textContent=state.users.filter(x=>x.role==='ADMIN').length;if($('pc'))$('pc').textContent=state.results.filter(x=>x.published).length;if($('superUp'))$('superUp').textContent=state.users.filter(x=>x.role==='USER').reduce((n,x)=>n+Number(x.up||0),0).toLocaleString('en-IN');if($('superCb'))$('superCb').textContent=state.users.filter(x=>x.role==='USER').reduce((n,x)=>n+Number(x.coins||0),0).toLocaleString('en-IN')}}
async function refresh(){if(!session||refreshBusy)return;refreshBusy=true;try{state=await api('/api/state');session.user=(await api('/api/me')).user;save();updateVisible()}catch(e){if(e.status===401||e.status===403){clear();loginPage()}}finally{refreshBusy=false}}
window.addEventListener('popstate',()=>{if(currentView.startsWith('panel:'))renderUser();else history.pushState({},'',location.href)});window.addEventListener('pageshow',()=>{if(session)refresh()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&session)refresh()});
load();history.replaceState({},'',location.href);if(session){loadState().then(route).catch(()=>{clear();loginPage()})}else{loginPage();loadPublicSettings()}setInterval(refresh,2000);
</script></body></html>
